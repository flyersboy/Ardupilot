name: build foxeer tramp reaper fix

on:
  push:
    branches:
      - foxeer-tramp-reaper-fix
    paths:
      - '.github/workflows/build_foxeer_tramp_reaper_fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: foxeer-tramp-reaper-fix
          fetch-depth: 0
          submodules: recursive

      - name: Apply upstream Tramp fixes without touching base branch
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/ArduPilot/ardupilot.git \
            7f2cec578adc74646142665b506f1e8b5c105f3c \
            8a14baa73892f47de432d1404e2bdb24f5a1ecf3
          git cherry-pick --no-commit 7f2cec578adc74646142665b506f1e8b5c105f3c
          git cherry-pick --no-commit 8a14baa73892f47de432d1404e2bdb24f5a1ecf3
          git rm .github/workflows/build_foxeer_tramp_reaper_fix.yml
          git diff --check
          git status --short

      - name: Build ArduCopter for MatekH743
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/lib/ccache:/opt/gcc-arm-none-eabi-10/bin:${PATH}"
          ./waf configure --board MatekH743
          ./waf copter
          test -f build/MatekH743/bin/arducopter.apj
          sha256sum build/MatekH743/bin/arducopter.apj | tee build/MatekH743/bin/arducopter.apj.sha256

      - name: Commit tested backport to target branch
        shell: bash
        run: |
          set -euxo pipefail
          git add -- \
            libraries/AP_VideoTX/AP_Tramp.cpp \
            libraries/AP_VideoTX/AP_Tramp.h \
            libraries/AP_VideoTX/AP_VideoTX.cpp \
            libraries/AP_VideoTX/AP_VideoTX.h
          git status --short
          git commit -m "AP_VideoTX: backport Tramp fixes for Foxeer Reaper"
          git push origin HEAD:foxeer-tramp-reaper-fix

      - name: Upload MatekH743 APJ
        uses: actions/upload-artifact@v4
        with:
          name: MatekH743-ArduCopter-4.6.3-foxeer-tramp-reaper-fix
          path: |
            build/MatekH743/bin/arducopter.apj
            build/MatekH743/bin/arducopter.apj.sha256
          if-no-files-found: error
          retention-days: 14
