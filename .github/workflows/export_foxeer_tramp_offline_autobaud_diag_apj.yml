# retry after correcting unified-diff hunk metadata
name: export foxeer tramp offline autobaud diagnostic MatekH743 APJ

on:
  push:
    branches:
      - foxeer-tramp-reaper-offline-autobaud-diagnostic
    paths:
      - '.github/workflows/export_foxeer_tramp_offline_autobaud_diag_apj.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: foxeer-tramp-reaper-offline-autobaud-diagnostic
          fetch-depth: 0
          submodules: recursive

      - name: Apply offline autobaud test patch
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git apply --check Tools/foxeer_tramp_offline_autobaud.patch
          git apply Tools/foxeer_tramp_offline_autobaud.patch
          git diff --check
          git diff -- libraries/AP_VideoTX/AP_Tramp.cpp

      - name: Build ArduCopter for MatekH743
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/usr/lib/ccache:/opt/gcc-arm-none-eabi-10/bin:${PATH}"
          ./waf configure --board MatekH743
          ./waf copter
          test -f build/MatekH743/bin/arducopter.apj
          sha256sum build/MatekH743/bin/arducopter.apj | tee build/MatekH743/bin/arducopter.apj.sha256

      - name: Upload MatekH743 APJ
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: MatekH743-ArduCopter-4.6.3-foxeer-tramp-offline-autobaud-diagnostic
          path: |
            build/MatekH743/bin/arducopter.apj
            build/MatekH743/bin/arducopter.apj.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Record artifact and clean workflow
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euxo pipefail
          git reset --hard HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          HASH=$(cut -d' ' -f1 build/MatekH743/bin/arducopter.apj.sha256)
          git rm .github/workflows/export_foxeer_tramp_offline_autobaud_diag_apj.yml
          git commit -m "CI: offline-autobaud diagnostic APJ run=${GITHUB_RUN_ID} artifact=${ARTIFACT_ID} sha256=${HASH}"
          git push origin HEAD:foxeer-tramp-reaper-offline-autobaud-diagnostic
